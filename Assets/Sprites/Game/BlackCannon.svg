<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" version="1.0">
  <!-- 1. 전체 영역을 검은색으로 가득 채워 단단한 실루엣 바탕을 만듭니다 -->
  <g fill="#000">
    <!-- 바퀴와 본체 -->
    <path d="M17 18.5a4 4 0 1 1-8 0 4 4 0 1 1 8 0z"/>
    <path d="M4 16.5v-6l14-1c5.995-.428 5.995 8.428 0 8z"/>
    <!-- 포구 테두리와 뒷부분 -->
    <path d="M5.5 13.5a1.5 3 0 1 1-3 0 1.5 3 0 1 1 3 0zM19 18.5a4 4 0 1 1-8 0 4 4 0 1 1 8 0z"/>
  </g>

  <!-- 2. 기물의 가장 바깥쪽 외곽선과 꼬리 부분을 일관되게 검정색으로 마감합니다 -->
  <g stroke="#000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="square" fill="none">
    <path d="M17 18.5a4 4 0 1 1-8 0 4 4 0 1 1 8 0z"/>
    <path d="M4 16.5v-6l14-1c5.995-.428 5.995 8.428 0 8z"/>
    <path d="M5.5 13.5a1.5 3 0 1 1-3 0 1.5 3 0 1 1 3 0z"/>
    <path d="M19 18.5a4 4 0 1 1-8 0 4 4 0 1 1 8 0z"/>
    <!-- 오른쪽 끝 꼬리 곡선 -->
    <path d="M21 13.5c6 2-1 4 1 7" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 3. 내부 겹침부와 앞쪽 포구의 경계를 구분 짓는 흰색 선들입니다 -->
  <g stroke="#FFF" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- [수정] 앞쪽 포구의 동그란 안쪽 경계선 - 반대쪽으로 기울어진 ( 모양 -->
    <path d="M 3.8 11.2 A 1.4 2.3 0 0 1 3.8 15.8" />

    <!-- 왼쪽 원(바퀴 지지대)의 뒷부분 겹침 경계선 -->
    <path d="M13 14.7a4 4 0 0 0-4 3.8" stroke-width="1.2" />
    <!-- 오른쪽 원(바퀴)의 뒷부분 겹침 경계선 -->
    <path d="M15 14.7a4 4 0 0 0-4 3.8" stroke-width="1.2" />
  </g>
</svg>
