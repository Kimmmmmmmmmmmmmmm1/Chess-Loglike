<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. 가장 바깥쪽 전체를 채우는 흰색 큰 원 (원래 외각의 얇은 검은색 테두리였던 부분이 흰색으로 반전됨) -->
  <circle cx="100" cy="100" r="90" fill="#ffffff" />
  
  <!-- 2. 그 안쪽의 검은색 링 (원래 흰색이었던 여백이 검은색으로 반전됨) -->
  <circle cx="100" cy="100" r="82" fill="#000000" />
  
  <!-- 3. 그 안쪽의 두꺼운 흰색 링 (원래 안쪽의 두꺼운 검은색 링이 흰색으로 반전됨) -->
  <circle cx="100" cy="100" r="63" fill="#ffffff" />
  
  <!-- 4. 가장 중심의 검은색 원 (원래 중심의 흰색 원이 검은색으로 반전됨) -->
  <circle cx="100" cy="100" r="37" fill="#000000" />
</svg>
